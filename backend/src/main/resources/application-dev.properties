# Perfil local: banco H2 em memoria, sem precisar de credenciais do Supabase.
# Os dados sao perdidos ao encerrar a aplicacao. Nao usar em producao.
spring.datasource.url=jdbc:h2:mem:aluguel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS aluguel
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false

app.jwt.secret=segredo-apenas-para-desenvolvimento-local-0123456789
app.seed.enabled=true
app.seed.senha=demo1234
