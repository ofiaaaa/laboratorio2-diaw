spring.application.name=aluguel-carros

# Permite guardar as variaveis abaixo em backend/.env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Banco de dados: Supabase (PostgreSQL)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Schema proprio: o schema "public" do Supabase fica exposto pela Data API
spring.jpa.properties.hibernate.default_schema=aluguel
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Autenticacao
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.validade-horas=8
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:5173}

# Carga inicial de agentes e automoveis
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.senha=${APP_SEED_SENHA:}
